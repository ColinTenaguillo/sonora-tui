[package]
name = "sonora-tui"
version = "0.15.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A terminal music player for TIDAL, Spotify, Apple Music, Deezer, YouTube Music, Subsonic and your own files"
repository = "https://github.com/ColinTenaguillo/sonora-tui"
homepage = "https://github.com/ColinTenaguillo/sonora-tui"
readme = "README.md"
# Not on crates.io: `music` and `storage` are git dependencies, which the
# registry refuses. The binaries from a tag are the only channel.
publish = false
keywords = ["tui", "music", "player", "streaming", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]
# The floor our dependencies set. sonora's `music` crate is edition 2024 and
# uses let chains, and its workspace pins 1.98.1; before it the floor was
# ratatui's 1.88. Raise this only after checking those again.
rust-version = "1.98"
# The README's screenshot. crates.io rewrites the relative link to GitHub, so
# the crate need not carry the PNG.
exclude = ["/docs"]

# `publish = false` hides the package from dist too; this puts it back,
# since the binaries from a tag are the release.
[package.metadata.dist]
dist = true

[lib]
name = "sonora_tui"
path = "src/lib.rs"

[[bin]]
name = "sonora-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# `music::engine::Fetch` is an async-trait trait, so implementing it is too.
async-trait = "0.1"
base64 = "0.23"
# Needed for EventStream, which ratatui's crossterm re-export does not expose.
# MUST track ratatui's crossterm version, or KeyEvent becomes two distinct types.
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0.0"
# Discord Rich Presence, over its local socket. Idle unless the config
# names a Discord application.
discord-rich-presence = "1.1"
futures = "0.3"
image = "0.25"
quick-xml = "0.42.0"
# `unstable-rendered-line-info` is for Paragraph::line_count, which is how
# far an open biography can scroll. Unstable in name; pinned here.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
# `rustls-no-provider` rather than `rustls`: the latter pins aws-lc-rs, and
# sonora's crates pin ring (librespot's hyper-rustls still brings aws-lc-rs
# in). With both in the tree rustls cannot pick a process default and the
# first TLS handshake that asks for one panics -- Spotify's did. `main`
# installs ring before anything, which settles it whatever the tree holds.
# `blocking` is required: SegmentReader runs on the audio thread, not the runtime.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider", "blocking", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Pinned EXACTLY: 0.22.0/0.22.1 ship a buffer-size regression that produces
# silence. Do not relax this pin without testing that audio still comes out.
# 0.22 also renamed the public API (Sink->Player, OutputStream->MixerDeviceSink),
# so every example you find online will fail to compile.
# `tracing`: without it rodio reports with eprintln!, which lands in the
# middle of the TUI.
rodio = { version = "=0.22.2", features = ["symphonia-flac", "symphonia-isomp4", "tracing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
toml = "1.1.5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# sonora's provider layer: the MusicProvider / MusicApi / engine::Fetch
# traits and the Spotify, Subsonic, Deezer, YouTube Music, local-file,
# lyrics and scrobbling implementations behind them. UI-agnostic (no gpui).
# Not on crates.io: it depends on sonora's own `storage` path crate, so it is
# a git dependency pinned to a commit. GPL-3.0-or-later.
# `bundled-sqlite`: the local-files provider keeps its index in SQLite, and
# a binary that links the system's would not start where there is none.
# `widevine`: the host for Google's CDM, which Apple Music's streams need.
# It compiles a small C++ shim, so a build from source wants a C++
# compiler; the module itself is never shipped, only fetched on the
# machine that uses it, with Google's terms shown first.
music = { git = "https://github.com/sonorahq/sonora", rev = "6c1fb890598094b93f6a5c06aa3100ac75f45d17", features = ["bundled-sqlite", "widevine"] }
# The SQLite files the local-files provider keeps its index in. The same
# workspace, so the same commit.
storage = { git = "https://github.com/sonorahq/sonora", rev = "6c1fb890598094b93f6a5c06aa3100ac75f45d17", features = ["bundled-sqlite"] }
# The service's own sign-in page in a window, for the cookie sign-ins
# (Apple Music, Deezer, YouTube Music), over a throwaway data store:
# WKWebView on macOS, WebKitGTK on Linux, opened at runtime so a system
# without it still starts. The same workspace, so the same commit.
webview = { git = "https://github.com/sonorahq/sonora", rev = "6c1fb890598094b93f6a5c06aa3100ac75f45d17" }

# The OS media keys. MPRIS is a D-Bus interface, so it is Linux-only by
# definition; macOS has its own below.
[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.11"

# Only to drive the MPRIS interface from the test suite, as a desktop would.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = "6"

# macOS has no MPRIS. Its media keys go to whatever registered with
# MPRemoteCommandCenter, which needs a Core Foundation run loop on the main
# thread -- see src/shell/mediakeys_macos.rs.
[target.'cfg(target_os = "macos")'.dependencies]
mediaplayer = "0.5.1"
# The Core Foundation run loop. Kept on the version mediaplayer uses.
apple-cf = "0.11"
# AppKit's event queue, pumped on the main thread while that window is up:
# a terminal app has no NSApplication of its own to deliver its clicks
# and keys.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphics", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSGeometry", "NSObject", "NSRunLoop", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKNavigationAction", "WKUIDelegate", "WKWebView", "WKWebViewConfiguration", "WKWindowFeatures"] }

[dev-dependencies]
insta = "1"

# Debug info is most of what a test build spends its time writing and
# linking: six binaries at 28k lines of it. Line tables alone still name
# the file and line in a panic, which is all a failing test needs.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# The dependencies are built once and then not touched. Optimising them
# costs that one build and makes every test run after it faster -- the
# image and audio decoding in particular.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Inherited from sonora's workspace: `music` only builds against these. The
# patched rodio reports 0.22.2, so the exact pin above still resolves to it.
[patch.crates-io]
librespot-audio = { git = "https://github.com/sonorahq/librespot", rev = "84f551d4afc7823ef12b6b02d09e34e2ddaccf99" }
librespot-core = { git = "https://github.com/sonorahq/librespot", rev = "84f551d4afc7823ef12b6b02d09e34e2ddaccf99" }
librespot-metadata = { git = "https://github.com/sonorahq/librespot", rev = "84f551d4afc7823ef12b6b02d09e34e2ddaccf99" }
librespot-oauth = { git = "https://github.com/sonorahq/librespot", rev = "84f551d4afc7823ef12b6b02d09e34e2ddaccf99" }
librespot-playback = { git = "https://github.com/sonorahq/librespot", rev = "84f551d4afc7823ef12b6b02d09e34e2ddaccf99" }
librespot-protocol = { git = "https://github.com/sonorahq/librespot", rev = "84f551d4afc7823ef12b6b02d09e34e2ddaccf99" }
rodio = { git = "https://github.com/RustAudio/rodio", rev = "880aaba54b00aead53651ed1ccbdb672d1375a95" }
