# Advisories cargo audit (CI's audit.yml) skips. All but the last two are in
# librespot, which sonora's `music` pulls in as a git dependency: its
# hyper-proxy2 and hyper-rustls hold rustls 0.22 and rustls-webpki 0.102 (and,
# through rustls-native-certs 0.7, rustls-pemfile), and librespot-core itself
# holds quick-xml 0.38 and rsa 0.9. Then paste, a proc-macro under lofty
# (`music`) and image's pulp and rav1e, all at their latest release. The last
# is the SQLite that rusqlite 0.40 bundles for sonora's `music` and `storage`,
# fixed from rusqlite 0.41; it is reached only through a database and its
# `-wal` file written by someone less trusted than the user.
# Nothing here can move them; the fix is upstream, then a new `music` pin.
# Drop an entry when its crate goes.
[advisories]
ignore = [
  "RUSTSEC-2026-0346", # rustls 0.22: Debug impls expose TLS secrets
  "RUSTSEC-2026-0349", # rustls 0.22: ServerHello downgrade of later connections
  "RUSTSEC-2026-0104", # rustls-webpki 0.102: panic parsing a CRL
  "RUSTSEC-2026-0049", # rustls-webpki 0.102: CRL distribution point matching
  "RUSTSEC-2026-0382", # rustls-webpki 0.102: distrusted intermediates accepted
  "RUSTSEC-2026-0099", # rustls-webpki 0.102: wildcard name constraints
  "RUSTSEC-2026-0098", # rustls-webpki 0.102: URI name constraints
  "RUSTSEC-2026-0194", # quick-xml 0.38: quadratic duplicate-attribute check
  "RUSTSEC-2026-0195", # quick-xml 0.38: unbounded namespace allocation
  "RUSTSEC-2023-0071", # rsa 0.9: Marvin timing attack, no fixed release
  "RUSTSEC-2025-0134", # rustls-pemfile 2: unmaintained, via hyper-proxy2
  "RUSTSEC-2024-0436", # paste 1: unmaintained, compile-time only
  "RUSTSEC-2026-0459", # libsqlite3-sys 0.38: bundled SQLite < 3.54, WAL page-size mismatch
]
