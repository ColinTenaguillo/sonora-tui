name: Update music

# `music` is a git dependency pinned to a commit of sonorahq/sonora, which
# Dependabot does not move. Weekly: read sonora's main, re-pin, build and
# test, and open a PR with the result. Nothing is opened when the pin is
# already current or when the build fails; the failed run is the signal.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Re-pin to sonora's main
        id: pin
        run: |
          set -euo pipefail
          old=$(sed -nE 's/^music = \{ git = "([^"]+)", rev = "([0-9a-f]+)".*/\2/p' Cargo.toml)
          new=$(git ls-remote https://github.com/sonorahq/sonora HEAD | cut -f1)
          echo "old=$old new=$new"
          if [ "$old" = "$new" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          sed -i -E "s/^(music = \{ git = \"[^\"]+\", rev = \")$old\"/\1$new\"/" Cargo.toml
          grep -q "rev = \"$new\"" Cargo.toml
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "old=${old:0:7}" >> "$GITHUB_OUTPUT"
          echo "new=${new:0:7}" >> "$GITHUB_OUTPUT"

      - name: Install the audio headers
        if: steps.pin.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        if: steps.pin.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.pin.outputs.changed == 'true'

      # Same gate as CI, run here because a PR opened with GITHUB_TOKEN does
      # not trigger CI on its own.
      - name: Update the lockfile, build and test
        if: steps.pin.outputs.changed == 'true'
        run: |
          cargo update -p music
          cargo build --locked --all-targets
          cargo test --locked

      - uses: peter-evans/create-pull-request@v8
        if: steps.pin.outputs.changed == 'true'
        with:
          branch: deps/music
          title: "build(deps): bump music to sonorahq/sonora@${{ steps.pin.outputs.new }}"
          commit-message: "build(deps): bump music from sonorahq/sonora@${{ steps.pin.outputs.old }} to ${{ steps.pin.outputs.new }}"
          body: |
            Re-pins the `music` git dependency from `${{ steps.pin.outputs.old }}` to `${{ steps.pin.outputs.new }}`.
            Built and tested on ubuntu in the workflow run that opened this PR.

            https://github.com/sonorahq/sonora/compare/${{ steps.pin.outputs.old }}...${{ steps.pin.outputs.new }}
          delete-branch: true
