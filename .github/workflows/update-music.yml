name: Update music

# `music` and `storage` are git dependencies pinned to a commit of
# sonorahq/sonora, which Dependabot does not move, and `[patch.crates-io]`
# holds the librespot and rodio forks that commit's workspace builds with.
# Weekly: read sonora's main, move all three pins to what it names, build
# and test, and open a PR with the result. Nothing is opened when the pin
# is already current or when the build fails; the failed run is the signal.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Re-pin to sonora's main
        id: pin
        run: |
          set -euo pipefail
          rev() { sed -nE "s#^$1 = \{ git = \"https://github.com/$2\", rev = \"([0-9a-f]+)\".*#\1#p" "$3" | head -1; }
          old=$(rev music sonorahq/sonora Cargo.toml)
          new=$(git ls-remote https://github.com/sonorahq/sonora HEAD | cut -f1)
          echo "old=$old new=$new"
          if [ "$old" = "$new" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          curl -fsSL "https://raw.githubusercontent.com/sonorahq/sonora/$new/Cargo.toml" > /tmp/sonora.toml
          old_ls=$(rev librespot-core sonorahq/librespot Cargo.toml)
          new_ls=$(rev librespot-core sonorahq/librespot /tmp/sonora.toml)
          old_rodio=$(rev rodio RustAudio/rodio Cargo.toml)
          new_rodio=$(rev rodio RustAudio/rodio /tmp/sonora.toml)
          test -n "$new_ls" && test -n "$new_rodio"
          # Each rev is a full sha, unique in the file, so a plain substitution
          # moves music, storage and every librespot crate together.
          sed -i -e "s/$old/$new/g" -e "s/$old_ls/$new_ls/g" -e "s/$old_rodio/$new_rodio/g" Cargo.toml
          test "$(grep -c "$old\|$old_ls\|$old_rodio" Cargo.toml)" = 0
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "old=${old:0:7}" >> "$GITHUB_OUTPUT"
          echo "new=${new:0:7}" >> "$GITHUB_OUTPUT"

      - name: Install the audio headers
        if: steps.pin.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        if: steps.pin.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.pin.outputs.changed == 'true'

      # A build without --locked moves only what the changed pins need and
      # leaves every other locked version, mediaplayer's included, alone;
      # `cargo update` would not (CONTRIBUTING). Same gate as CI, run here
      # because a PR opened with GITHUB_TOKEN does not trigger CI on its own.
      - name: Update the lockfile, build and test
        if: steps.pin.outputs.changed == 'true'
        run: |
          cargo build --all-targets
          cargo test --locked

      - uses: peter-evans/create-pull-request@v8
        if: steps.pin.outputs.changed == 'true'
        with:
          branch: deps/music
          title: "build(deps): bump music to sonorahq/sonora@${{ steps.pin.outputs.new }}"
          commit-message: "build(deps): bump music from sonorahq/sonora@${{ steps.pin.outputs.old }} to ${{ steps.pin.outputs.new }}"
          body: |
            Re-pins the `music` git dependency from `${{ steps.pin.outputs.old }}` to `${{ steps.pin.outputs.new }}`.
            Built and tested on ubuntu in the workflow run that opened this PR.

            https://github.com/sonorahq/sonora/compare/${{ steps.pin.outputs.old }}...${{ steps.pin.outputs.new }}
          delete-branch: true
